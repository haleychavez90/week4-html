<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Pet Owner Sign-Up Form</title>
</head>
<body>
    <h1>Pet Owner Sign-Up Form</h1>
    <script>
        console.log(state); 
        debugger; 
    </script>
    <form id="signup-form">
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first-name" required><br><br>
        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last-name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required><br><br>
        <label for="zip">Zip Code:</label>
        <input type="text" id="zip" name="zip" required><br><br>
        <label for="pet-name">Pet's Name:</label>
        <input type="text" id="pet-name" name="pet-name" required><br><br>
        <label for="pet-type">Type of Pet:</label>
        <select id="pet-type" name="pet-type" required>
            <option value="">Select a pet type</option>
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
            <option value="bird">Bird</option>
            <option value="other">Other</option>
        </select><br><br>
        <label for="pet-age">Pet's Age:</label>
        <input type="number" id="pet-age" name="pet-age" min="0" required><br><br>
        <button type="submit">Sign Up</button>
    </form>
    <script>
        const state = {};
        console.log(state);
        debugger; 

        function saveForm() {
            console.log("button clicked!");

            const firstName = document.getElementById("first-name").value;
            const lastName = document.getElementById("last-name").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const petType = document.getElementById("pet-type").value;
            const petAge = document.getElementById("pet-age").value;

            state.firstName = firstName;
            state.lastName = lastName;
            state.email = email;
            state.phone = phone;
            state.petType = petType;
            state.petAge = petAge;

            console.log(state);
        }

        function createPetOwner(firstName, petName, petType) {
            return {
                firstName: firstName,
                petName: petName,
                petType: petType,
                status() {
                    return `${this.firstName} is the owner of a ${this.petType} named ${this.petName}.`;
                },
                describe() {
                    return `This pet owner is named ${this.firstName} and has a ${this.petType} named ${this.petName}.`;
                },
                render() {
                    return `<div><h2>${this.firstName}</h2><p>Pet Type: ${this.petType}</p><p>Pet Name: ${this.petName}</p></div>`;
                }   
            };
        }

        document.getElementById("signup-form").addEventListener("submit", function(event) {
            event.preventDefault(); 
            saveForm();
            const petOwner = createPetOwner(state.firstName, state.petName, state.petType);
            console.log(petOwner.describe());
        });
    </script>
</body>
</html>
